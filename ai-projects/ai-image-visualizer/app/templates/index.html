<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Image Visualizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 1.8rem;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed #a0aec0;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .drop-zone.dragover {
      border-color: #4f46e5;
      background: #eef2ff;
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-zone .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .drop-zone p { color: #555; font-size: 0.95rem; }
    .drop-zone span { color: #4f46e5; font-weight: 600; }

    /* Preview */
    #preview {
      display: none;
      margin-top: 16px;
      text-align: center;
    }

    #preview img {
      max-height: 220px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      object-fit: contain;
    }

    /* Button */
    button#analyzeBtn {
      display: none;
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button#analyzeBtn:hover { opacity: 0.9; }
    button#analyzeBtn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Loader */
    .loader {
      display: none;
      text-align: center;
      margin-top: 20px;
      color: #4f46e5;
      font-size: 0.9rem;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 4px solid #e0e7ff;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Results */
    #results { display: none; margin-top: 28px; }

    .result-section {
      background: #f8fafc;
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 14px;
      border-left: 4px solid #4f46e5;
    }

    .result-section h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin-bottom: 8px;
    }

    .result-section p {
      color: #1a1a2e;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .sentiment-badge {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.05em;
    }

    .POSITIVE  { background: #d1fae5; color: #065f46; }
    .NEGATIVE  { background: #fee2e2; color: #991b1b; }
    .NEUTRAL   { background: #e0e7ff; color: #3730a3; }
    .MIXED     { background: #fef3c7; color: #92400e; }

    .scores {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .score-item {
      flex: 1;
      min-width: 100px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }

    .score-item .label { font-size: 0.72rem; color: #888; text-transform: uppercase; }
    .score-item .value { font-size: 1.1rem; font-weight: 700; color: #1a1a2e; }

    .error-msg {
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 16px;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🖼️ AI Image Visualizer</h1>
    <p class="subtitle">Upload an image to extract text and analyze its sentiment using AWS AI services.</p>

    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="image/jpeg,image/png" />
      <div class="icon">📂</div>
      <p><span>Click to upload</span> or drag & drop</p>
      <p style="margin-top:6px; font-size:0.8rem; color:#aaa;">JPEG, PNG supported</p>
    </div>

    <div id="preview"><img id="previewImg" src="" alt="Preview" /></div>

    <button id="analyzeBtn">✨ Analyze Image</button>

    <div class="loader" id="loader">
      <div class="spinner"></div>
      Analyzing with AWS Rekognition &amp; Comprehend…
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div id="results">
      <div class="result-section">
        <h3>Extracted Text</h3>
        <p id="extractedText"></p>
      </div>
      <div class="result-section">
        <h3>Sentiment</h3>
        <span class="sentiment-badge" id="sentimentBadge"></span>
        <div class="scores" id="scoresContainer"></div>
      </div>
    </div>
  </div>

  <script>
    const dropZone   = document.getElementById('dropZone');
    const fileInput  = document.getElementById('fileInput');
    const preview    = document.getElementById('preview');
    const previewImg = document.getElementById('previewImg');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const loader     = document.getElementById('loader');
    const results    = document.getElementById('results');
    const errorMsg   = document.getElementById('errorMsg');

    let selectedFile = null;

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

    function handleFile(file) {
      if (!file) return;
      selectedFile = file;
      previewImg.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      analyzeBtn.style.display = 'block';
      results.style.display = 'none';
      errorMsg.style.display = 'none';
    }

    analyzeBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      analyzeBtn.disabled = true;
      loader.style.display = 'block';
      results.style.display = 'none';
      errorMsg.style.display = 'none';

      const formData = new FormData();
      formData.append('image', selectedFile);

      try {
        const res  = await fetch('/analyze', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.error) throw new Error(data.error);

        document.getElementById('extractedText').textContent =
          data.text || '(No text detected in the image)';

        const badge = document.getElementById('sentimentBadge');
        badge.textContent  = data.sentiment;
        badge.className    = 'sentiment-badge ' + data.sentiment;

        const scoresContainer = document.getElementById('scoresContainer');
        scoresContainer.innerHTML = '';
        for (const [label, pct] of Object.entries(data.scores || {})) {
          scoresContainer.innerHTML += `
            <div class="score-item">
              <div class="label">${label}</div>
              <div class="value">${pct}%</div>
            </div>`;
        }

        results.style.display = 'block';
      } catch (err) {
        errorMsg.textContent   = '⚠️ ' + err.message;
        errorMsg.style.display = 'block';
      } finally {
        analyzeBtn.disabled    = false;
        loader.style.display   = 'none';
      }
    });
  </script>
</body>
</html>
